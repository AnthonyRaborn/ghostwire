version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Its refs name Rust toolchains, not action releases: @1.88 is the MSRV the
      # msrv job pins, which Dependabot would otherwise "bump" to a newer Rust.
      - dependency-name: dtolnay/rust-toolchain
