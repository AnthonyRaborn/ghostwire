[package]
name = "ghostwire-tui"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal dashboard for live public data feeds, styled as a netrunner rig you've jacked into."
license = "MIT"
authors = ["Anthony W. Raborn <anthony@raborndecisionsciences.com>"]
repository = "https://github.com/AnthonyRaborn/ghostwire"
readme = "README.md"
keywords = ["terminal", "tui", "dashboard", "weather", "cyberpunk"]
categories = ["command-line-utilities", "visualization"]

[[bin]]
name = "ghostwire"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
fastrand = "2.5.0"
feed-rs = "2.4.0"
futures-util = "0.3.34"
libc = "0.2.189"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
